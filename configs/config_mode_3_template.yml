# Paths
result_folder_path: './results/mode_3'
# Run Mode 2 first or replace these with another package-trained model and sidecar.
prediction_model_path: './results/mode_2/Model/Prediction_model_theta_0.62.pkl'
# model_path is an alias for prediction_model_path; use only one.
model_path: null
model_metadata_path: './results/mode_2/Model/model_metadata.json'
# Must contain exactly the SNP list recorded in model_metadata.json.
SNP_csv_path: './data/Toy_X_single.csv'
# Threshold learned by the bundled Mode 2 example; match this to the tested model.
pure_threshold: 0.62

# Model Sidecar Params
# These are usually discovered from model_metadata_path, but can be overridden.
prediction_model_type: null
scaler_path: null
pca_model_path: null
model_input_scaler_path: null

# Optional: add label_path to calculate strict and loose accuracy.
label_path: null

# Runtime Params
configure_logging: true
