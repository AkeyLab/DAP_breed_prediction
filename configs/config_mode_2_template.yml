# Paths
result_folder_path: './results/mode_2'
# Mode 2 retrains on SNPs shared by this input and the complete DAP reference.
SNP_csv_path: './data/Toy_X_single.csv'
# Optional class subset. Remove this key to retrain all 100 outputs.
breed_list_text_path: './data/paper_14_breed_list.txt'

# Training Params
# Keep this false for an exact 14-output targeted model.
include_unknown: false
training_model_name: random_forest
# Only used when training_model_name is xgboost.
# xgboost_device: auto
pca_components: 0.95
random_state: 42

# Runtime Params
configure_logging: true
