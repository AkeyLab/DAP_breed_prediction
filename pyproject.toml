[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dap-breed-prediction"
version = "0.1.0"
description = "Dog breed prediction and admixture estimation pipeline for DAP-based experiments."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "joblib>=1.3",
  "matplotlib>=3.7",
  "numpy>=1.23",
  "pandas>=1.5",
  "polars>=0.20",
  "PyYAML>=6.0",
  "scikit-learn>=1.2",
]

[project.scripts]
dap-breed-predict = "dap_breed_prediction.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

